name: rn-e2e-maestro

on:
  workflow_dispatch:
    inputs:
      node_version:
        description: Node.js version
        required: false
        default: '18.20.5'
      rn_version:
        description: React Native version
        required: false
        default: '0.74.3'

jobs:
  android:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      JAVA_HOME: /usr/lib/jvm/temurin-17-jdk-amd64
      NODE_VERSION: ${{ inputs.node_version || '18.20.5' }}
      RN_VERSION: ${{ inputs.rn_version || '0.74.3' }}
      SAMPLE_APP: rnsample
      REVLM_PORT: 3000
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 10

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.pnpm-store
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-store-${{ runner.os }}-

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Install repo deps
        run: pnpm install --frozen-lockfile

      - name: Build shared
        run: |
          pnpm --filter @kedaruma/revlm-shared run build
          cd packages/revlm-shared
          npm pack --silent
          mv kedaruma-revlm-shared-*.tgz /tmp/revlm-shared.tgz

      - name: Build and pack client
        run: |
          pnpm --filter @kedaruma/revlm-client run build
          cd packages/revlm-client
          cp package.json /tmp/revlm-client-package.json.bak
          node -e "const fs=require('fs');const pkg=require('./package.json');pkg.dependencies=pkg.dependencies||{};pkg.dependencies['@kedaruma/revlm-shared']='file:/tmp/revlm-shared.tgz';fs.writeFileSync('package.json',JSON.stringify(pkg,null,2));"
          npm pack --silent --pack-destination /tmp
          mv /tmp/kedaruma-revlm-client-*.tgz /tmp/revlm-client.tgz
          tar -xOf /tmp/revlm-client.tgz package/package.json
          mv /tmp/revlm-client-package.json.bak package.json
          echo "/tmp/revlm-client.tgz" > /tmp/revlm-client-tarball
          cat /tmp/revlm-client-tarball

      - name: Build server
        run: pnpm --filter @kedaruma/revlm-server run build

      - name: Start MongoMemory-backed Revlm server
        run: |
          node scripts/start-revlm-memory-server.js &
          echo $! > /tmp/revlm-server.pid

      - name: Install Android SDK components
        run: |
          echo "🧹 Cleaning old Android images to free space..."
          rm -rf $ANDROID_HOME/system-images || true
          rm -rf ~/.android/avd || true
          yes | sdkmanager --licenses
          sdkmanager "platform-tools" "platforms;android-33" "build-tools;34.0.0" "system-images;android-33;google_apis;x86_64" "emulator"

      - name: Debug Android SDK state
        run: |
          echo "🧰 Installed system images:"
          ls -R $ANDROID_HOME/system-images || true
          echo "🧰 Installed build-tools:"
          ls $ANDROID_HOME/build-tools || true
          echo "💾 Disk usage:"
          df -h /

      - name: Generate minimal RN app
        run: |
          npx react-native@${RN_VERSION} init $SAMPLE_APP --version ${RN_VERSION} --skip-install
          cd $SAMPLE_APP
          cat > metro.config.js <<'EOF'
          const { getDefaultConfig } = require('@react-native/metro-config');
          const config = getDefaultConfig(__dirname);
          config.resolver.unstable_enablePackageExports = true;
          module.exports = config;
          EOF
          cat > App.js <<'EOF'
          import React, { useState } from 'react';
          import { SafeAreaView, Text, TextInput, Button, ScrollView, StyleSheet, Platform } from 'react-native';
          import '@kedaruma/revlm-client/rn-setup';
          import { Revlm } from '@kedaruma/revlm-client';

          const baseUrl = Platform.OS === 'android' ? 'http://10.0.2.2:3000' : 'http://localhost:3000';
          const provisionalAuthSecretMaster = 'ci-provisional-secret';
          const provisionalAuthDomain = 'ci.revlm.dev';

          export default function App() {
            const [log, setLog] = useState('');
            const [status, setStatus] = useState('idle');
            const [result, setResult] = useState('');
            const [error, setError] = useState('');

            const run = async () => {
              setStatus('running');
              setLog('starting');
              setError('');
              setResult('');
              try {
                const revlm = new Revlm(baseUrl, {
                  provisionalEnabled: true,
                  provisionalAuthSecretMaster,
                  provisionalAuthDomain,
                  autoSetToken: true,
                });
                const authId = `ci-user-${Date.now()}`;
                const password = 'secret123!';

                setLog((l) => l + '\nprovisional');
                await revlm.provisionalLogin(authId);

                setLog((l) => l + '\nregister');
                await revlm.registerUser({ authId, userType: 'user', roles: [] }, password);

                setLog((l) => l + '\nlogin');
                await revlm.login(authId, password);

                setLog((l) => l + '\nfind');
                const coll = revlm.db('revlm-e2e').collection('demo');
                const findRes = await coll.find({});
                setResult(JSON.stringify(findRes));
                setStatus('success');
                setLog((l) => l + '\ndone');
              } catch (err) {
                setStatus('error');
                setError(String(err));
              }
            };

            return (
              <SafeAreaView style={styles.container}>
                <ScrollView>
                  <Text testID="status">status:{status}</Text>
                  <Button title="Run flow" testID="run-button" onPress={run} />
                  <Text selectable testID="log">{log}</Text>
                  <Text selectable testID="result">{result}</Text>
                  {error ? <Text selectable testID="error">{error}</Text> : null}
                </ScrollView>
              </SafeAreaView>
            );
          }

          const styles = StyleSheet.create({
            container: {
              flex: 1,
              padding: 16,
              gap: 8,
            },
          });
          EOF
          mkdir -p e2e
          cat > e2e/flow.yaml <<'EOF'
          appId: com.rnsample
          ---
          - launchApp
          - tapOn:
              id: "run-button"
          - assertVisible:
              id: "status"
              text: "status:success"
          - assertVisible:
              id: "result"
          EOF

      - name: Cache RN node_modules
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.SAMPLE_APP }}/node_modules
          key: rn-node-modules-${{ runner.os }}-${{ env.RN_VERSION }}-${{ hashFiles('package.json', 'pnpm-lock.yaml') }}
          restore-keys: |
            rn-node-modules-${{ runner.os }}-${{ env.RN_VERSION }}-
            rn-node-modules-${{ runner.os }}-

      - name: Cache RN Android Gradle
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.SAMPLE_APP }}/android/.gradle
          key: rn-android-gradle-${{ runner.os }}-${{ hashFiles('package.json', 'pnpm-lock.yaml') }}
          restore-keys: |
            rn-android-gradle-${{ runner.os }}-

      - name: Install RN app deps
        run: |
          cd $SAMPLE_APP
          CLIENT_TGZ=$(cat /tmp/revlm-client-tarball)
          if [ -z "$CLIENT_TGZ" ] || [ ! -f "$CLIENT_TGZ" ]; then echo "client tarball not found"; exit 1; fi
          npm install --legacy-peer-deps
          npm install --legacy-peer-deps "$CLIENT_TGZ" /tmp/revlm-shared.tgz react-native-get-random-values@1.11.0 fast-text-encoding buffer @peculiar/webcrypto

      - name: Build Android app
        run: |
          cd $SAMPLE_APP/android
          ./gradlew assembleDebug

      - name: Install Maestro
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> $GITHUB_PATH

      - name: Run Maestro flow on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          force-avd-creation: true
          emulator-boot-timeout: 600000
          disk-size: 2000M
          emulator-options: "-no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -accel off -partition-size 1024 -no-metrics"
          script: |
            echo "🚀 Waiting for emulator device..."
            adb -s "$ANDROID_SERIAL" wait-for-device
            SERIAL=${ANDROID_SERIAL:-$(adb devices | awk 'NR==2 {print $1}')}
            echo "📱 Device list:" && adb devices -l
            if [ -z "$SERIAL" ]; then echo "❌ No emulator device detected"; exit 1; fi
            echo "⏳ Checking boot status..."
            adb -s "$SERIAL" shell getprop sys.boot_completed
            echo "📦 Installing APK..."
            adb -s "$SERIAL" install -r $SAMPLE_APP/android/app/build/outputs/apk/debug/app-debug.apk
            echo "🖼  Taking screenshot..."
            adb -s "$SERIAL" shell input keyevent 82 || true
            adb -s "$SERIAL" exec-out screencap -p > /tmp/emulator.png || true
            echo "▶️  Running Maestro flow..."
            maestro test $SAMPLE_APP/e2e/flow.yaml

      - name: Upload emulator screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-screenshot
          path: /tmp/emulator.png
